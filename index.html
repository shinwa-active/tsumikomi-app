  .badge{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:bold;}
  .b-green{background:#d1fae5;color:#065f46;} .b-amber{background:#fef3c7;color:#92400e;}
  .b-red{background:#fee2e2;color:#991b1b;} .b-teal{background:#ccfbf1;color:#115e59;}
  .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#e2e8f0;flex-shrink:0;}
  .row{display:flex;padding:12px 0;border-bottom:1px solid #f1f5f9;}
  .row .k{width:110px;color:#64748b;font-size:14px;flex-shrink:0;}
  .panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e2e8f0;display:flex;}
  .tab{flex:1;padding:10px;text-align:center;color:#94a3b8;background:none;border:none;font-size:12px;font-weight:bold;}
  .tab.on{color:var(--blue);}
  .tab .ic{font-size:22px;display:block;}
  .toast{position:fixed;bottom:100px;left:0;right:0;max-width:480px;margin:0 auto;padding:0 16px;z-index:50;}
  .toast .in{background:#0f172a;color:#fff;border-radius:12px;padding:14px;text-align:center;font-weight:bold;}
  .stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;}
  .stat .n{font-size:30px;font-weight:800;}
  .bar{height:24px;border-radius:999px;background:#3b82f6;color:#fff;font-size:13px;font-weight:bold;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:24px;}
  .err{color:var(--red);font-weight:bold;margin-top:8px;text-align:center;}
  .hint{color:#94a3b8;font-size:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .center{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;}
  .cand-list{max-height:150px;}

/* ---- 日付ラベル ---- */
function dayLabel(iso){
  const d=new Date(iso), n=new Date();
  const same=(a,b)=>a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate();
  const y=new Date(n); y.setDate(n.getDate()-1);
  if(same(d,n)) return lang==="ja"?"本日":"Today";
  if(same(d,y)) return lang==="ja"?"昨日":"Yesterday";
  return (d.getMonth()+1)+"/"+d.getDate();
}
function hhmm(iso){ const d=new Date(iso); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function isToday(iso){ const d=new Date(iso),n=new Date(); return d.getFullYear()==n.getFullYear()&&d.getMonth()==n.getMonth()&&d.getDate()==n.getDate(); }

  if(signedCache[path]) return signedCache[path];
  try{ const {data}=await sb.storage.from("photos").createSignedUrl(path,3600); if(data&&data.signedUrl){signedCache[path]=data.signedUrl; return data.signedUrl;} }catch(e){}
  return null;
}

let yoku=[];
function todayStr(){ const n=new Date(); return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2); }
function isWeekend(){ const d=new Date().getDay(); return d===0||d===6; }
function ydone(r){ return r.done===true && r.done_date===todayStr(); }
async function loadYoko(){
  const {data,error}=await sb.from("yokomochi_status").select("*").order("sort_order",{ascending:true});
  if(error){ console.error(error); return; }
  yoku=data||[];
  if(view.name==="home") render();
}
async function toggleYoko(id){
  if(isViewOnly||isDestOnly) return viewOnlyBlock();
  const row=yoku.find(x=>x.id===id); if(!row) return;
  let justCompleted=false;
  if(!ydone(row)){
    if(!confirm((lang==="ja"?"完了にします：\n\n":"Mark as done:\n\n")+row.label+(lang==="ja"?"\n\nよろしいですか？":"\n\nOK?"))) return;
    await sb.from("yokomochi_status").update({done:true,done_at:new Date().toISOString(),done_date:todayStr(),updated_at:new Date().toISOString()}).eq("id",id);
    justCompleted=true;
  } else {
    if(!confirm((lang==="ja"?"完了を取り消します：\n\n":"Undo completion:\n\n")+row.label+(lang==="ja"?"\n\nよろしいですか？":"\n\nOK?"))) return;
    await sb.from("yokomochi_status").update({done:false,done_at:null,done_date:null,updated_at:new Date().toISOString()}).eq("id",id);
  }
  await loadYoko();
  if(justCompleted) await checkYokoGroupZero(row.label);
}
function yokoGroupPrefix(label){
  if(!label) return null;
  if(label.indexOf("DC2 5F")===0) return "DC2 5F";
  if(label.indexOf("DC2 3F")===0) return "DC2 3F";
  if(label.indexOf("アトム電器")===0) return "アトム電器";
  return null;
}
async function checkYokoGroupZero(label){
  const prefix=yokoGroupPrefix(label); if(!prefix) return;
  const group=yoku.filter(r=>yokoGroupPrefix(r.label)===prefix);
  if(!group.length || !group.every(ydone)) return;
  const targets=pal.filter(r=>r.label && r.label.indexOf(prefix)===0);
  for(const tgt of targets){ await sb.from("pallet_remain").update({remain:0,updated_at:new Date().toISOString(),updated_date:todayStr()}).eq("id",tgt.id); }
  if(targets.length){ await loadPal(); toast(lang==="ja"?prefix+" のパレット残数を0にしました":prefix+" pallets reset to 0"); }
}
let pal=[];
function palBase(r){ return r.updated_date===todayStr() ? (r.remain||0) : 0; }
function palTime(r){ return (r.updated_date===todayStr() && r.updated_at) ? hhmm(r.updated_at) : null; }
async function loadPal(){
  const {data,error}=await sb.from("pallet_remain").select("*").order("sort_order",{ascending:true});
  if(error){ console.error(error); return; }
  pal=data||[];
  if(view.name==="pallet"||view.name==="home") render();
}
async function palAdjust(id,delta){
  if(isViewOnly||isDestOnly) return viewOnlyBlock();
  const row=pal.find(x=>x.id===id); if(!row) return;
  let v=palBase(row)+delta; if(v<0) v=0;
  await sb.from("pallet_remain").update({remain:v,updated_at:new Date().toISOString(),updated_date:todayStr()}).eq("id",id);
  await loadPal();
}

/* ---- 物量管理 ---- */
let vol=[];
function volTodayVal(r){ return r.updated_date===todayStr() ? r.today_value : null; }
function volTodayOk(r){ return r.updated_date===todayStr() ? !!r.today_ok : false; }
function volDeadlinePassed(r){
  if(r.deadline_hour==null) return false;
  const n=new Date();
  const dl=new Date(); dl.setHours(r.deadline_hour, r.deadline_minute||0, 0, 0);
  return n>dl;
}
function volStatus(r){
  const v=volTodayVal(r);
  if(v==null){ return volDeadlinePassed(r) ? "missing" : "none"; }
  if(volTodayOk(r)) return "ok";
  if(r.alert_value!=null && v>=r.alert_value) return "alert";
  if(r.warn_value!=null && v>=r.warn_value) return "warn";
  return "ok";
}

  const {data,error}=await sb.from("volume_shipment").select("*").order("sort_order",{ascending:true});

  vol=data||[];

async function start(){

function renderLogin(){
  app.innerHTML = `<div class="pad" style="padding-top:48px;">
    <h1>${t().loginTitle}</h1><p>${t().loginSub}</p>
    <label style="margin-top:0">${t().email}</label>
    <div style="display:flex;align-items:center;gap:6px">
      <input id="emailId" placeholder="" autocomplete="username" style="flex:1" autocapitalize="off" autocorrect="off">
      <span style="white-space:nowrap;color:#475569;font-weight:bold">@shinwa-active.co.jp</span>
    </div>
    <p class="hint">${lang==="ja"?"アルファベットは小文字のみです（大文字は入力できません）":"Letters are lowercase only (uppercase cannot be entered)"}</p>
    <label>${t().pass}</label>
    <input id="pass" type="password" placeholder="${t().pass}" autocomplete="current-password">
    <button class="btn" id="loginBtn">${t().login}</button>
    <div id="loginMsg" class="err"></div>
  </div>`;
  document.getElementById("loginBtn").onclick=doLogin;
  document.getElementById("pass").onkeydown=e=>{ if(e.key==="Enter") doLogin(); };
  const emailIdEl=document.getElementById("emailId");
  emailIdEl.onkeydown=e=>{ if(e.key==="Enter") document.getElementById("pass").focus(); };
  emailIdEl.oninput=()=>{
    const pos=emailIdEl.selectionStart;
    const lower=emailIdEl.value.toLowerCase();
    if(lower!==emailIdEl.value){ emailIdEl.value=lower; try{ emailIdEl.setSelectionRange(pos,pos); }catch(e){} }
  };
}
async function doLogin(){
  const idPart=document.getElementById("emailId").value.trim().toLowerCase().replace(/@.*$/,"");
  const email=idPart?idPart+"@shinwa-active.co.jp":"";
  const pass=document.getElementById("pass").value;
  const msg=document.getElementById("loginMsg"); msg.style.color="#64748b"; msg.textContent=t().loggingIn;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ msg.style.color="#dc2626"; msg.textContent=t().loginNg+error.message; return; }
  const {data}=await sb.auth.getSession(); user=data.session.user;
  await afterLogin();
}
async function afterLogin(){
  isViewOnly = !!(user && user.email && VIEW_ONLY_EMAILS.includes(user.email.toLowerCase()));
  isDestOnly = !!(user && user.email && DEST_ONLY_EMAILS.includes(user.email.toLowerCase()));
  await loadRecords();
  await loadYoko();
  await loadPal();
  await loadMaster();
  await loadVol();
  sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"load_records"},loadRecords)
    .on("postgres_changes",{event:"*",schema:"public",table:"courses"},loadRecords)
    .on("postgres_changes",{event:"*",schema:"public",table:"yokomochi_status"},loadYoko)
    .on("postgres_changes",{event:"*",schema:"public",table:"pallet_remain"},loadPal)
    .on("postgres_changes",{event:"*",schema:"public",table:"master_items"},loadMaster)
    .on("postgres_changes",{event:"*",schema:"public",table:"volume_shipment"},loadVol).subscribe();
}

function go(name,params){
  if(pendingCompleteId!=null && name!=="detail" && name!=="addmore"){
    const rec=records.find(x=>String(x.id)===String(pendingCompleteId));
    if(rec && !rec.completed){
      const msg=lang==="ja"?"まだ「積込完了」を押していません。\n\nこのまま移動しますか？":"You haven't pressed \"Mark as loaded\" yet.\n\nLeave anyway?";
      if(!confirm(msg)) return;
    }
    pendingCompleteId=null;
  }
  view=Object.assign({name},params||{}); render(); window.scrollTo(0,0);
}

async function ensureMasterValue(kind,v){

  const so=(masterRows[kind]||[]).reduce((mx,r)=>Math.max(mx,r.sort_order),0)+1;
  const {data,error}=await sb.from("master_items").insert({kind:kind,value:v,sort_order:so,color:""}).select();

      const up=await sb.storage.from("photos").upload(path,f,{contentType:f.type||"image/jpeg"});
      if(!up.error){ await sb.from("photos").insert({record_id:rec.id,storage_path:path,kind:"load",taken_at:new Date().toISOString()}); }
    }

    if(a.length) await sb.from("anomaly_logs").insert(a.map(m=>({record_id:rec.id,type:"input",message:m})));
    await sb.from("notifications").insert({record_id:rec.id,message:`${dest||"-"} / ${truck||"-"} 登録`});
    toast(t().saved);

}

async function markComplete(id){
  if(isViewOnly||isDestOnly) return viewOnlyBlock();
  if(String(pendingCompleteId)===String(id)) pendingCompleteId=null;
  await sb.from("load_records").update({completed:true,completed_at:new Date().toISOString()}).eq("id",id);
  const rec=records.find(x=>String(x.id)===String(id));
  const warns=[];
  const okiFirst = rec && rec.oki_chi ? String(rec.oki_chi).split("、")[0] : "";
  if(rec && okiFirst){
    if((rec.pl_dc1||0)>0){
      const row=pal.find(r=>r.label && r.label.indexOf(okiFirst)===0 && r.label.indexOf("DC1")>=0);
      if(row) await palAdjust(row.id,-rec.pl_dc1); else warns.push(okiFirst+"→DC1");
    }
    if((rec.pl_dc3||0)>0){
      const row=pal.find(r=>r.label && r.label.indexOf(okiFirst)===0 && r.label.indexOf("DC3")>=0);
      if(row) await palAdjust(row.id,-rec.pl_dc3); else warns.push(okiFirst+"→DC3");
    }
  }
  toast(lang==="ja"?"積込完了にしました":"Marked loaded");
  if(warns.length) toast((lang==="ja"?"パレット残数の対象が見つかりません：":"Pallet route not found: ")+warns.join("、"));
  await loadRecords();
  if(role==="worker") go("home"); else renderDetail(id);
}

      <p class="hint">${lang==="ja"?"このマスタは全員で共有されます（編集できるのは管理者だけ）。下のボタンは、この端末に残っている古いマスタを、クラウドに引き継ぐとき一度だけ押します。":"Shared with everyone. Use the button once to upload this device's old master to the cloud."}</p>

    </div>
  </div>`+tabbar();
}
function renderMasterVolume(){

      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <div style="flex:1"><label style="font-size:12px;color:#64748b;font-weight:normal">${lang==="ja"?"締切 時":"Deadline hour"}</label><input id="mv_h_${r.id}" inputmode="numeric" value="${r.deadline_hour!=null?r.deadline_hour:""}" placeholder="0-23"></div>
        <div style="flex:1"><label style="font-size:12px;color:#64748b;font-weight:normal">${lang==="ja"?"締切 分":"Deadline min"}</label><input id="mv_m_${r.id}" inputmode="numeric" value="${r.deadline_minute!=null?r.deadline_minute:""}" placeholder="0-59"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <div style="flex:1"><label style="font-size:12px;color:#64748b;font-weight:normal">${lang==="ja"?"平均":"Avg"}</label><input id="mv_avg_${r.id}" inputmode="numeric" value="${r.avg_value!=null?r.avg_value:""}"></div>
        <div style="flex:1"><label style="font-size:12px;color:#b45309;font-weight:normal">${lang==="ja"?"注意":"Warn"}</label><input id="mv_warn_${r.id}" inputmode="numeric" value="${r.warn_value!=null?r.warn_value:""}"></div>
        <div style="flex:1"><label style="font-size:12px;color:#b91c1c;font-weight:normal">${lang==="ja"?"警告":"Alert"}</label><input id="mv_alert_${r.id}" inputmode="numeric" value="${r.alert_value!=null?r.alert_value:""}"></div>
      </div>
      <button class="btn small ghost" style="width:100%;margin-top:8px" onclick="masterVolSave(${r.id})">${lang==="ja"?"この場所を保存":"Save this row"}</button>
    </div>`;
  app.innerHTML=topbar()+header(t().masterTitle)+`<div class="pad">
    <div style="display:flex;gap:8px;margin-bottom:8px">
      ${tabBtn("dest","📦 "+t().mDest)}${tabBtn("truck","🚚 "+t().mTruck)}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">

    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      ${tabBtn("oki_chi","🏭 "+t().mOki)}${tabBtn("volume","📊 "+(lang==="ja"?"物量":"Volume"))}
    </div>

      <input id="mvNew" placeholder="${lang==="ja"?"場所の名前":"Location name"}" style="flex:1">

    </div>
    <p class="hint" style="margin-top:8px">${lang==="ja"?"入力値が「注意」以上で黄色、「警告」以上で赤色になります。各項目を直したら「この場所を保存」を押してください。":"Values at or above Warn turn yellow; at or above Alert turn red. Press save after editing."}</p>

async function masterVolAdd(){
  const el=document.getElementById("mvNew"); const v=el.value.trim(); if(!v) return;
  const so=vol.reduce((mx,r)=>Math.max(mx,r.sort_order||0),0)+1;
  const {error}=await sb.from("volume_shipment").insert({label:v,sort_order:so});
  if(error){ toast(lang==="ja"?"保存に失敗しました":"Save failed"); return; }
  el.value=""; await loadVol(); renderMaster();
}
async function masterVolDel(id){
  if(!confirm(t().mDelQ)) return;
  const {error}=await sb.from("volume_shipment").delete().eq("id",id);
  if(error){ toast(lang==="ja"?"削除に失敗しました":"Delete failed"); return; }
  await loadVol(); renderMaster();
}
async function masterVolMove(i,dir){
  const j=i+dir; if(j<0||j>=vol.length) return;
  const arr=vol.slice(); const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  const changed=[];
  arr.forEach((r,idx)=>{ if(r.sort_order!==idx){ r.sort_order=idx; changed.push(r); } });
  vol=arr; renderMaster();
  const results=await Promise.all(changed.map(r=>sb.from("volume_shipment").update({sort_order:r.sort_order}).eq("id",r.id)));
  if(results.some(x=>x&&x.error)){ toast(lang==="ja"?"並べ替えの保存に失敗しました":"Reorder save failed"); await loadVol(); }
}
async function masterVolSave(id){
  const g=k=>{ const el=document.getElementById(k+"_"+id); if(!el) return null; const s=el.value.trim(); return s===""?null:parseInt(s); };
  const label=document.getElementById("mv_label_"+id).value.trim();
  const payload={
    label: label||undefined,
    deadline_hour:g("mv_h"), deadline_minute:g("mv_m"),
    avg_value:g("mv_avg"), warn_value:g("mv_warn"), alert_value:g("mv_alert")
  };
  if(!label){ toast(lang==="ja"?"名前を入力してください":"Name is required"); return; }
  const {error}=await sb.from("volume_shipment").update(payload).eq("id",id);
  if(error){ toast(lang==="ja"?"保存に失敗しました":"Save failed"); return; }
  toast(lang==="ja"?"保存しました":"Saved");
  await loadVol(); renderMaster();
}
async function masterAdd(){ const el=document.getElementById("mNew"); const v=el.value.trim(); if(!v)return; if(getMaster(mf.mode).includes(v)){ el.value=""; return; }
  const so=(masterRows[mf.mode]||[]).reduce((mx,r)=>Math.max(mx,r.sort_order),0)+1;
  const {data,error}=await sb.from("master_items").insert({kind:mf.mode,value:v,sort_order:so,color:""}).select();
  if(error||!data){ toast(lang==="ja"?"保存に失敗しました":"Save failed"); return; }
  (masterRows[mf.mode]=masterRows[mf.mode]||[]).push({id:data[0].id,value:v,sort_order:so,color:""}); el.value=""; renderMaster();
}
const COURSE_SORT_ORDER={course_dc1:["red","blue",""],course_dc3:["yellow",""]};
async function masterSortByColor(){
  const order=COURSE_SORT_ORDER[mf.mode]; if(!order) return;
  const allColors=MCOLORS.map(c=>c.key);
  const fullOrder=order.concat(allColors.filter(k=>!order.includes(k)));
  const labelOf=k=>{ const c=MCOLORS.find(x=>x.key===k); return c?c.label:k; };
  if(!confirm((lang==="ja"?"次の色の順番でまとめて並べ替えます：\n\n":"Reorder by color:\n\n")+order.map(labelOf).join(" → ")+(lang==="ja"?"\n\nよろしいですか？":"\n\nOK?"))) return;
  const arr=(masterRows[mf.mode]||[]).slice();
  const indexed=arr.map((r,idx)=>({r,idx,rank:fullOrder.indexOf(r.color||"")}));
  indexed.sort((a,b)=>(a.rank-b.rank)||(a.idx-b.idx));
  const changed=[];
  indexed.forEach((item,newIdx)=>{ if(item.r.sort_order!==newIdx){ item.r.sort_order=newIdx; changed.push(item.r); } });
  masterRows[mf.mode]=indexed.map(item=>item.r);
  renderMaster();
  const results=await Promise.all(changed.map(r=>sb.from("master_items").update({sort_order:r.sort_order}).eq("id",r.id)));
  if(results.some(x=>x&&x.error)){ toast(lang==="ja"?"並べ替えの保存に失敗しました":"Reorder save failed"); await loadMaster(); }
  else toast(lang==="ja"?"色でまとめて並べ替えました":"Reordered by color");
}
async function masterMove(i,dir){
  const arr=masterRows[mf.mode]||[]; const j=i+dir; if(j<0||j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  const changed=[];
  arr.forEach((r,idx)=>{ if(r.sort_order!==idx){ r.sort_order=idx; changed.push(r); } });
  renderMaster();
  const results=await Promise.all(changed.map(r=>sb.from("master_items").update({sort_order:r.sort_order}).eq("id",r.id)));
  if(results.some(x=>x&&x.error)){ toast(lang==="ja"?"並べ替えの保存に失敗しました":"Reorder save failed"); await loadMaster(); }
}
async function masterColor(i,key){
  const row=(masterRows[mf.mode]||[])[i]; if(!row) return;
  const {error}=await sb.from("master_items").update({color:key}).eq("id",row.id);
  if(error){ toast(lang==="ja"?"色の保存に失敗しました":"Color save failed"); return; }
  row.color=key; renderMaster();
}
async function masterEdit(i){ const row=(masterRows[mf.mode]||[])[i]; if(!row) return; const v=prompt(t().mSave,row.value); if(!v||!v.trim()) return;
  const {error}=await sb.from("master_items").update({value:v.trim()}).eq("id",row.id);
  if(error){ toast(lang==="ja"?"保存に失敗しました":"Save failed"); return; }
  row.value=v.trim(); renderMaster();
}
async function masterDel(i){ if(!confirm(t().mDelQ))return; const row=(masterRows[mf.mode]||[])[i]; if(!row) return;
  const {error}=await sb.from("master_items").delete().eq("id",row.id);
  if(error){ toast(lang==="ja"?"削除に失敗しました":"Delete failed"); return; }
  masterRows[mf.mode].splice(i,1); renderMaster();
}
async function masterUpload(){
  if(!confirm(lang==="ja"?"この端末のマスタ（トラック・納品先・コース）を、クラウドに引き継ぎます。よろしいですか？":"Upload this device's master to the cloud?")) return;
  const kinds=["truck","dest","course_dc1","course_dc3","oki_chi"]; let added=0;
  for(const k of kinds){
    let local=[]; try{ local=JSON.parse(localStorage.getItem("m_"+k)||"[]"); }catch(e){}
    const existing=new Set(getMaster(k));
    let so=(masterRows[k]||[]).reduce((mx,r)=>Math.max(mx,r.sort_order),0);
    const rows=[];
    local.forEach(v=>{ if(v && !existing.has(v)){ so++; rows.push({kind:k,value:v,sort_order:so}); existing.add(v); } });
    if(rows.length){ const {error}=await sb.from("master_items").insert(rows); if(!error) added+=rows.length; }
  }
  await loadMaster();
  toast((lang==="ja"?added+"件をクラウドに引き継ぎました":added+" items uploaded"));
}
